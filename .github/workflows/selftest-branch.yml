# Written by selftest/branch.sh. PRs into verify/selftest/selftest/b1 run the gate from engine branch selftest/b1.
name: verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [verify/selftest/selftest/b1]
permissions: {}
concurrency:
  group: verification-selftest-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verification:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    uses: nguyenhoanglong-tech/verification/.github/workflows/gate.yml@selftest/b1
    with:
      engine_ref: selftest/b1
