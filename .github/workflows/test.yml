name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ vars.VERIFICATION_RUNNER || 'ubuntu-24.04' }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
