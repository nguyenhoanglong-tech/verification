name: head-caller
on: pull_request
permissions: {}
jobs:
  verification:
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: write
      id-token: write
    uses: nguyenhoanglong-tech/verification/.github/workflows/gate.yml@dev
    with:
      engine_ref: dev
      app_id: "5828645"
    secrets:
      VERIFICATION_APP_KEY: ${{ secrets.VERIFICATION_APP_KEY }}
