# The verification gate (DECISIONS D6-D28 in chrislongnguyen/dotfiles claude/docs/verification).
# Called from a thin pull_request_target caller on each repo's default branch, pinned by SHA.
# The PR head is data: no job that holds a token or id-token executes head code.
# Every job runs on the caller's `runner` and inside an image pinned by digest (D13), so moving the gate to a
# self-hosted runner is a change to one repo variable.
name: gate
on:
  workflow_call:
    inputs:
      engine_ref:
        description: The engine commit the caller pins (the same SHA as in its `uses:` line).
        type: string
        required: true
      runner:
        description: The runner label every job runs on; callers set it from the VERIFICATION_RUNNER repo variable.
        type: string
        required: false
        default: ubuntu-24.04
permissions: {}
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
jobs:
  start:
    runs-on: ${{ inputs.runner }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 5
    permissions:
      checks: write
    outputs:
      check_id: ${{ steps.s.outputs.check_id }}
      base_sha: ${{ steps.s.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: nguyenhoanglong-tech/verification
          ref: ${{ inputs.engine_ref }}
          path: engine-src
          persist-credentials: false
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "engine-src/engine")
          import github
          repo, base_ref = os.environ["GITHUB_REPOSITORY"], os.environ["BASE_REF"]
          # The base branch tip when this run started, resolved once here; every later job takes it from this output.
          # Not github.sha: that is the default-branch tip under pull_request_target and the merge commit under
          # pull_request. Not the PR event's base, which can be stale.
          if not base_ref or not all(c.isalnum() or c in "._/-" for c in base_ref):
              sys.exit(f"::error::base ref name is not plain enough to look up: {base_ref}")
          base_sha = github.api(f"repos/{repo}/git/ref/heads/{base_ref}")["object"]["sha"]
          print(f"base {base_sha}")
          run = github.api(f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "POST", {
              "name": "verification", "head_sha": os.environ["HEAD_SHA"], "status": "in_progress",
              "output": {"title": "running", "summary": f"The verification gate is running on {os.environ['HEAD_SHA']}."}})
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"check_id={run['id']}\nbase_sha={base_sha}\n")
          PY

  tier:
    needs: start
    runs-on: ${{ inputs.runner }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.t.outputs.base_sha }}
      mode: ${{ steps.t.outputs.mode }}
      error: ${{ steps.t.outputs.error }}
      tiers: ${{ steps.t.outputs.tiers }}
      code_lines: ${{ steps.t.outputs.code_lines }}
      reasons: ${{ steps.t.outputs.reasons }}
      review: ${{ steps.t.outputs.review }}
      skip: ${{ steps.t.outputs.skip }}
      switch_spec: ${{ steps.t.outputs.switch_spec }}
      spec_text: ${{ steps.t.outputs.spec_text }}
      budget: ${{ steps.t.outputs.budget }}
      standards: ${{ steps.t.outputs.standards }}
      review_model: ${{ steps.t.outputs.review_model }}
      review_level: ${{ steps.t.outputs.review_level }}
      review_effort: ${{ steps.t.outputs.review_effort }}
      checks: ${{ steps.t.outputs.checks }}
      has_checks: ${{ steps.t.outputs.has_checks }}
      anthropic: ${{ steps.t.outputs.anthropic }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: nguyenhoanglong-tech/verification
          ref: ${{ inputs.engine_ref }}
          path: engine-src
          persist-credentials: false
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.start.outputs.base_sha }}
        run: python3 engine-src/engine/tier.py github

  head_archive:
    needs: tier
    if: needs.tier.outputs.has_checks == 'true'
    runs-on: ${{ inputs.runner }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: echo "base ${{ needs.tier.outputs.base_sha }}"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - run: tar -czf head.tgz -C head .
      - uses: actions/upload-artifact@v4
        with:
          name: head-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: head.tgz
          retention-days: 3

  checks:
    # Runs head code, so it holds no token, no id-token and no secrets (D13). Each check runs in its own
    # throwaway container with no network and no view of this job's files, so it cannot write this job's outputs
    # or leave a process behind; only its exit code counts.
    needs: [tier, head_archive]
    runs-on: ${{ inputs.runner }}
    container:
      image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 20
    permissions: {}
    outputs:
      results: ${{ steps.run.outputs.results }}
      head: ${{ steps.run.outputs.head }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: head-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
      - id: run
        shell: sh
        env:
          CHECKS: ${{ needs.tier.outputs.checks }}
          IMAGE: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
        run: |
          echo "base ${{ needs.tier.outputs.base_sha }}"
          mkdir head && tar -xzf head.tgz -C head && rm head.tgz
          results=""
          for item in $CHECKS; do
            name=$(echo "${item%%:*}" | base64 -d); cmd=$(echo "${item#*:}" | base64 -d)
            echo "::group::$name: $cmd"
            cid=$(docker create --network none -w /w "$IMAGE" bash -c "$cmd")
            docker cp head/. "$cid:/w"
            # Head output must not reach the command parser: a mask command in it would drop this job's outputs.
            stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
            echo "::stop-commands::$stop"
            if docker start -a "$cid"; then r=pass; else r=fail; fi
            echo "::$stop::"
            docker rm -f "$cid" >/dev/null
            echo "::endgroup::"
            echo "$name=$r"
            results="$results${results:+,}{\"name\":\"$name\",\"result\":\"$r\"}"
          done
          { echo "results=[$results]"; echo "head=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"

  review:
    needs: tier
    if: needs.tier.outputs.review == 'true'
    runs-on: ${{ inputs.runner }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 40
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.c.outputs.result }}
      head: ${{ steps.c.outputs.head }}
    steps:
      - run: echo "base ${{ needs.tier.outputs.base_sha }}"
      # The working directory is the base at the SHA the tier job resolved. The review action checks the head
      # out and moves it out of the working directory before any model call.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tier.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: nguyenhoanglong-tech/verification
          ref: ${{ inputs.engine_ref }}
          path: .verification-engine
          persist-credentials: false
      - id: c
        uses: ./.verification-engine/engine/claude-job
        with:
          model: ${{ needs.tier.outputs.review_model }}
          effort: ${{ needs.tier.outputs.review_effort }}
          level: ${{ needs.tier.outputs.review_level }}
          anthropic: ${{ needs.tier.outputs.anthropic }}
          base_sha: ${{ needs.tier.outputs.base_sha }}
          spec_text: ${{ needs.tier.outputs.spec_text }}
          standards: ${{ needs.tier.outputs.standards }}
          pace: ${{ needs.tier.outputs.budget }}

  gate:
    # The one result the ruleset reads. One gate at a time per head, so each reads the verdicts the one before it
    # wrote. queue: max keeps every waiting gate (up to 100); without it a newer gate cancels the waiting one.
    needs: [start, tier, checks, review]
    if: always()
    concurrency:
      group: verification-gate-${{ github.repository }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ inputs.runner }}
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - run: echo "base ${{ needs.tier.outputs.base_sha }}"
      - uses: actions/checkout@v6
        with:
          repository: nguyenhoanglong-tech/verification
          ref: ${{ inputs.engine_ref }}
          path: engine-src
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python3 engine-src/engine/verdict.py post
