# .github/verification.toml for chrislongnguyen/dotfiles. The engine reads it from the PR's base SHA.
mode = "observe"                        # observe | enforce (D10, D27)
enforce_branches = ["verify/attack-base"]   # the attack suite's guarded base
allowed_bots = []
observe_sample = 10                     # observe mode: Claude checks on 1 PR in 10 (API credit cap)                       # the D20 App bot, once it exists

[anthropic]                             # personal org (D17)
federation_rule_id = "fdrl_011Xnhp64qZrrs3D8z49fbSJ"
organization_id = "9661d981-ce74-4832-bd6f-92048d9aea93"
service_account_id = "svac_01Vrgh4uDhqvqr6iLQsaxMyZ"
workspace_id = "wrkspc_018nwehRHTcTJ5ihWRdjWnVy"

[review]                                # D8
t1_model = "claude-sonnet-5-5"
t1_level = "medium"
t2_model = "claude-opus-5-5"
t2_level = "high"

[tiers]                                 # D7, D22
t2_lines = 300
docs = ["**/*.md", "**/*.txt", "**/*.svg", "**/*.mmd", "**/*.png", "**/*.html", "claude/docs/receipts/**", "LICENSE"]
prompt = ["**/SKILL.md", "**/CLAUDE.md", "**/AGENTS.md", "claude/rules/**", "**/PORTABLE.md", "claude/agents/*.md"]
risk = [
  ".github/**",
  "claude/hooks/**",
  "claude/settings.json",
  "claude/install.sh",
  "claude/scripts/render-settings.py",
  "claude/scripts/git-safety-gate.py",
  "claude/scripts/git-pre-push.sh",
  "claude/scripts/install-git-hooks.sh",
  "claude/scripts/gate-selftest.sh",
  "claude/scripts/security/**",
  "claude/scripts/tests/pre-commit-stages-test.sh",
  "claude/scripts/tests/guards-*",
  "claude/scripts/merge-if-green.sh",
  "claude/scripts/state-checks.py",
  "claude/scripts/sync-skill-loaders.sh",
  "claude/scripts/claude-accounts.py",
  "claude/spine/**",
  "claude/skills/disk-cleanup/**",
  "claude/memory-pipeline/scripts/session-compress-daemon.py",
  "claude/skills/deep-fucking-research/scripts/dfr_codex_runner.mjs",
  "tools/grok-permission-reviewer/proxy.py",
  "claude/optchat/**",
  "**/*.tla",                            # models are risk on purpose: they prove the gates
]
