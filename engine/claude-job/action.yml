name: verification review
description: The Bugs call and, when the switch is on, the Spec call, on the API or the Claude subscription (D8, D16, D18), with the PR head read as data.
inputs:
  model: {required: true, description: Claude model id}
  effort: {required: true, description: reasoning effort}
  level: {required: false, default: medium, description: /code-review level}
  base_sha: {required: true, description: the base branch tip the tier job resolved}
  anthropic: {required: true, description: "JSON with federation_rule_id, organization_id, service_account_id, workspace_id"}
  spec_text: {required: false, default: '""', description: "JSON string: the done-when sections the Spec call checks; empty means no Spec call"}
  standards: {required: false, default: CODING_STANDARDS.md, description: the coding standards file at base}
  budget: {required: false, default: "3", description: max USD per call}
  pace: {required: false, default: "{}", description: "JSON: the tier job's budget (caps, totals, billing route); each re-read routes against it"}
  claude_code_oauth_token: {required: false, default: "", description: "D18: the subscription token; empty means no subscription call"}
outputs:
  result: {description: "JSON: findings, spec, cost_usd, subscription_cost_usd, billing, error, budget_refused", value: "${{ steps.review.outputs.result }}"}
  head: {description: head SHA the review ran on, value: "${{ steps.head.outputs.head }}"}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr-head
        fetch-depth: 0
        persist-credentials: false
    - id: head
      shell: bash
      run: echo "head=$(git -c safe.directory="*" -C pr-head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Install Claude Code
      shell: bash
      env:
        CLAUDE_CODE_VERSION: "2.1.326"
      run: |
        for i in 1 2 3; do curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION" && break; sleep 5; done
        test "$("$HOME/.local/bin/claude" --version | cut -d' ' -f1)" = "$CLAUDE_CODE_VERSION"
    - id: review
      shell: bash
      env:
        HEAD_DIR: pr-head
        BASE_SHA: ${{ inputs.base_sha }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        LEVEL: ${{ inputs.level }}
        ANTHROPIC: ${{ inputs.anthropic }}
        SPEC_TEXT: ${{ inputs.spec_text }}
        STANDARDS: ${{ inputs.standards }}
        BUDGET_USD: ${{ inputs.budget }}
        PACE: ${{ inputs.pace }}
        GH_TOKEN: ${{ github.token }}
        # Under its own name: review.py takes it out of its env and hands it to the subscription call alone.
        SUBSCRIPTION_TOKEN: ${{ inputs.claude_code_oauth_token }}
      run: python3 "$GITHUB_ACTION_PATH/review.py"
